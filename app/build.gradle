plugins {
    alias(libs.plugins.android.application)
}

def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { localProps.load(it) }
def str = { String v -> '"' + v.replace('"', '\\"') + '"' }

// local.properties 中的配置项及默认值，全部注入 BuildConfig
def configKeys = [
        DEEPSEEK_API_KEY           : '',
        DEEPSEEK_CHAT_MODEL        : 'deepseek-v4-flash',
        DEEPSEEK_VISION_MODEL      : 'deepseek-v4-flash-vision-exp',
        DASHSCOPE_API_KEY          : '',
        QWEN_VL_MODEL              : 'qwen-vl-plus',
        QWEATHER_API_HOST          : '',
        QWEATHER_API_KEY           : '',
        SMS_PROVIDER               : 'fake',
        ALIYUN_AK_ID               : '',
        ALIYUN_AK_SECRET           : '',
        ALIYUN_SMS_SIGN_NAME       : '',
        ALIYUN_SMS_TPL_LOGIN       : '100001',
        ALIYUN_SMS_TPL_RESET       : '100003',
        ALIYUN_SMS_TPL_CHANGE_PHONE: '',
]

android {
    namespace 'com.heban.app'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.heban.app"
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        configKeys.each { k, d ->
            buildConfigField "String", k, str(localProps.getProperty(k, d))
        }
    }

    flavorDimensions = ["data"]
    productFlavors {
        mock {
            dimension "data"
            buildConfigField "String", "API_BASE_URL", '"https://example.invalid/"'
        }
        remote {
            dimension "data"
            // 后端地址待定
            buildConfigField "String", "API_BASE_URL", '"https://api.heban.example/"'
        }
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

