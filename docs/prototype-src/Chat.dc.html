<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>私信 草莓姐姐</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font-family:Roboto,'Noto Sans SC',sans-serif}
input::placeholder{color:#43483E}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ib{width:48px;height:48px;flex-shrink:0;border:0;padding:0;background:transparent;border-radius:24px;color:#43483E;display:flex;align-items:center;justify-content:center;cursor:pointer}
.av{width:32px;height:32px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<a href="Messages.dc.html" class="ib" aria-label="返回" style="color: #191D16"><span class="ms" aria-hidden="true">arrow_back</span></a>
<a href="UserProfile.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px">
<span class="av" style="width: 40px; height: 40px; border-radius: 20px; font-size: 16px; background: #BBEBEC; color: #1E4E4E">莓</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 24px; font-weight: 500">草莓姐姐</span><span style="font-size: 12px; line-height: 16px; color: #43483E">种植能手 · 通常 1 小时内回复</span></span>
</a>
<button class="ib" aria-label="更多：查看主页、举报、拉黑"><span class="ms" aria-hidden="true">more_vert</span></button>
</header>

<a href="Product.dc.html" style="margin: 0 16px 8px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; border: 1px solid #C3C8BB; border-radius: 12px; padding: 8px 12px 8px 8px">
<span style="width: 48px; height: 48px; border-radius: 8px; background: #E1E4D9; color: #74796D; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">image</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px">句容红颜草莓 当天现摘</span><span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #456732">¥25 /斤</span></span>
<span style="font-size: 14px; font-weight: 500; color: #456732">查看</span>
</a>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px">
<div style="align-self: center; font-size: 12px; line-height: 16px; color: #43483E">今天 14:20</div>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="5">
<div style="display: flex; gap: 8px; align-items: flex-end; flex-direction: {{m.dir}}">
<span class="av" style="background: {{m.avBg}}; color: {{m.avFg}}">{{m.av}}</span>
<sc-if value="{{m.isImg}}" hint-placeholder-val="{{ false }}"><span style="width: 160px; height: 120px; border-radius: 16px; background: #E1E4D9; color: #74796D; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">image</span></span></sc-if>
<sc-if value="{{m.isText}}" hint-placeholder-val="{{ true }}"><span style="max-width: 260px; padding: 10px 14px; font-size: 15px; line-height: 22px; background: {{m.bg}}; color: {{m.fg}}; border-radius: {{m.rad}}">{{m.text}}</span></sc-if>
</div>
</sc-for>
<sc-if value="{{typing}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; line-height: 16px; color: #43483E; padding-left: 40px">对方正在输入…</div></sc-if>
<div role="note" style="align-self: center; max-width: 320px; background: #FFE08B; color: #241A00; border-radius: 12px; padding: 8px 12px; display: flex; gap: 8px; font-size: 12px; line-height: 18px">
<span class="ms" aria-hidden="true" style="font-size: 16px">shield</span>交易请当面验货，不要提前转账或扫陌生二维码
</div>
</main>

<div style="flex-shrink: 0; padding: 8px 12px 20px 4px; display: flex; align-items: center; gap: 4px">
<button class="ib" aria-label="发送图片"><span class="ms" aria-hidden="true">add_circle</span></button>
<label style="flex: 1; min-width: 0; height: 48px; border-radius: 24px; background: #E7E9DF; display: flex; align-items: center; padding: 0 20px">
<input aria-label="输入消息" placeholder="发消息…" value="{{draft}}" onChange="{{onDraft}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; line-height: 24px; color: #191D16">
</label>
<button onClick="{{send}}" aria-label="发送" style="width: 48px; height: 48px; flex-shrink: 0; border: 0; padding: 0; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin-left: 4px; cursor: pointer; background: {{sendBg}}; color: {{sendFg}}"><span class="ms" aria-hidden="true">send</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    if (this.t) clearTimeout(this.t);
  }
  renderVals() {
    const st = this.state || {};
    const draft = st.draft || '';
    const base = [
      { me: true, text: '你好，草莓还有吗？想要 10 斤' },
      { me: false, text: '有的，今天早上刚摘的，你看下' },
      { me: false, img: true },
      { me: true, text: '看着不错！明天上午能来园里自提吗？' },
      { me: false, text: '好的，明天上午可以来园里自提' }
    ];
    const all = base.concat(st.extra || []);
    const msgs = all.slice(-6).map((m) => ({
      isImg: !!m.img, isText: !m.img, text: m.text || '',
      dir: m.me ? 'row-reverse' : 'row',
      av: m.me ? '李' : '莓', avBg: m.me ? '#456732' : '#BBEBEC', avFg: m.me ? '#FFFFFF' : '#1E4E4E',
      bg: m.me ? '#456732' : '#E7E9DF', fg: m.me ? '#FFFFFF' : '#191D16',
      rad: m.me ? '20px 4px 20px 20px' : '4px 20px 20px 20px'
    }));
    const has = draft.trim().length > 0;
    return {
      msgs, draft, typing: !!st.typing,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      sendBg: has ? '#456732' : '#E1E4D9', sendFg: has ? '#FFFFFF' : '#74796D',
      send: () => {
        if (!has) return;
        const extra = (st.extra || []).concat([{ me: true, text: draft.trim() }]);
        this.setState({ extra, draft: '', typing: true });
        if (this.t) clearTimeout(this.t);
        this.t = setTimeout(() => {
          const cur = (this.state && this.state.extra) || extra;
          this.setState({ extra: cur.concat([{ me: false, text: '收到，到了园门口给我打电话就行' }]), typing: false });
        }, 1200);
      }
    };
  }
}
</script>
</body>
</html>
