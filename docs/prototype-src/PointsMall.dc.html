<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>积分商城</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:Roboto,'Noto Sans SC',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ib{width:48px;height:48px;flex-shrink:0;border-radius:24px;color:#43483E;display:flex;align-items:center;justify-content:center}
.chip{height:32px;box-sizing:border-box;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;cursor:pointer}
.qk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:500}
.card{background:#F2F5EA;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15)}
.card .im{height:120px;background:#E1E4D9;color:#74796D;display:flex;align-items:center;justify-content:center;position:relative}
.card .tg{position:absolute;left:8px;top:8px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;line-height:22px;font-weight:500}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<a href="CheckIn.dc.html" class="ib" aria-label="返回" style="color: #191D16"><span class="ms" aria-hidden="true">arrow_back</span></a>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">积分商城</h1>
<a href="Service.dc.html" class="ib" aria-label="禾伴客服"><span class="ms" aria-hidden="true">support_agent</span></a>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 14px">
<section aria-label="我的积分" style="background: #C5EFAB; color: #2E4F1C; border-radius: 28px; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div><div style="font-size: 14px; line-height: 20px">我的积分</div><div style="font-size: 36px; line-height: 44px">1,280</div></div>
<nav aria-label="积分快捷入口" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid rgba(46, 79, 28, 0.2); padding-top: 12px">
<a href="PointsDetail.dc.html" class="qk"><span class="ms" aria-hidden="true">receipt</span>积分明细</a>
<a href="Orders.dc.html" class="qk"><span class="ms" aria-hidden="true">local_shipping</span>兑换记录</a>
<a href="CheckIn.dc.html" class="qk"><span class="ms" aria-hidden="true">add_task</span>赚积分</a>
<a href="PointsRules.dc.html" class="qk"><span class="ms" aria-hidden="true">help</span>规则</a>
</nav>
</section>

<div style="display: flex; gap: 8px; align-items: center">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
<span role="button" aria-pressed="{{c.on}}" class="chip" style="background: {{c.bg}}; color: {{c.fg}}; border: {{c.bd}}; padding: {{c.pad}}" onClick="{{c.pick}}"><sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span></sc-if>{{c.name}}</span>
</sc-for>
<span style="flex: 1"></span>
<span style="font-size: 12px; line-height: 16px; color: #43483E">实物官方发货 · 包邮</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<a href="MallItem.dc.html" class="card">
<span class="im"><span class="ms" aria-hidden="true" style="font-size: 36px">{{p.icon}}</span><span class="tg" style="background: {{p.tBg}}; color: {{p.tFg}}">{{p.tag}}</span></span>
<span style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; line-height: 20px; font-weight: 500; height: 40px; overflow: hidden">{{p.name}}</span>
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 18px; line-height: 24px; font-weight: 500; color: #456732">{{p.pts}}</span><span style="font-size: 12px; color: #43483E">积分</span></span>
<span style="font-size: 12px; line-height: 16px; color: {{p.noteC}}">{{p.note}}</span>
</span>
</a>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = (this.state && this.state.c) || '全部';
    const mine = 1280;
    const real = { tag: '实物', tBg: '#D9E7CB', tFg: '#3E4A35' };
    const deco = { tag: '装扮 · 即时到账', tBg: '#BBEBEC', tFg: '#1E4E4E' };
    const all = [
      Object.assign({ cat: '实物', name: '番茄种子组合（樱桃番茄 + 大番茄）', pts: 600, icon: 'nutrition', sold: 318 }, real),
      Object.assign({ cat: '实物', name: '加厚园艺手套 2 双', pts: 400, icon: 'back_hand', sold: 526 }, real),
      Object.assign({ cat: '实物', name: '不锈钢修枝剪', pts: 1200, icon: 'content_cut', sold: 97 }, real),
      Object.assign({ cat: '实物', name: '腐熟有机肥 10 kg', pts: 1500, icon: 'compost', sold: 64 }, real),
      Object.assign({ cat: '装扮', name: '头像框「丰收」', pts: 200, icon: 'account_circle', sold: 1204 }, deco),
      Object.assign({ cat: '装扮', name: '主页封面「麦浪」', pts: 300, icon: 'wallpaper', sold: 836 }, deco)
    ];
    const items = all.filter((p) => cur === '全部' || p.cat === cur).map((p) => {
      const enough = mine >= p.pts;
      return Object.assign({}, p, {
        pts: p.pts.toLocaleString('en-US'),
        note: enough ? '已兑换 ' + p.sold + ' 件' : '还差 ' + (p.pts - mine) + ' 积分',
        noteC: enough ? '#43483E' : '#BA1A1A'
      });
    });
    return {
      items,
      cats: ['全部', '实物', '装扮'].map((n) => {
        const on = n === cur;
        return { name: n, on, bg: on ? '#D9E7CB' : 'transparent', fg: on ? '#3E4A35' : '#43483E', bd: on ? '1px solid #D9E7CB' : '1px solid #C3C8BB', pad: on ? '0 14px 0 8px' : '0 14px', pick: () => this.setState({ c: n }) };
      })
    };
  }
}
</script>
</body>
</html>
