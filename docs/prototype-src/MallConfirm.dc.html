<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>确认兑换</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:Roboto,'Noto Sans SC',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;line-height:20px}
.cta{height:56px;width:100%;box-sizing:border-box;border:0;border-radius:28px;font-size:16px;line-height:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<a href="MallItem.dc.html" aria-label="返回" style="width: 48px; height: 48px; border-radius: 24px; color: #191D16; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></a>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">确认兑换</h1>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px">
<a href="Address.dc.html" style="display: flex; align-items: center; gap: 14px; background: #F2F5EA; border-radius: 16px; padding: 16px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #C5EFAB; color: #2E4F1C; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">location_on</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 500">老李 <span style="font-weight: 400; color: #43483E; font-size: 14px">138****5678</span><span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #D9E7CB; color: #3E4A35; font-size: 11px; line-height: 20px; font-weight: 500">默认</span></span>
<span style="font-size: 14px; line-height: 20px; color: #43483E">江苏省 南京市 江宁区 禾丰村 18 号（李家菜园）</span>
</span>
<span class="ms" aria-hidden="true" style="color: #43483E">chevron_right</span>
</a>

<div style="display: flex; gap: 12px; align-items: center; border: 1px solid #C3C8BB; border-radius: 16px; padding: 12px">
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 8px; background: #E1E4D9; color: #74796D; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 32px">nutrition</span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; line-height: 22px; font-weight: 500">番茄种子组合（樱桃番茄 + 大番茄）</span><span style="font-size: 13px; line-height: 18px; color: #43483E">禾伴官方发货 · 包邮</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; font-size: 14px"><span style="font-weight: 500; color: #456732">600 积分</span><span style="color: #43483E">× 1</span></span>
</div>

<div style="background: #F2F5EA; border-radius: 16px; padding: 4px 16px">
<div class="row"><span style="color: #43483E">商品积分</span><span>600</span></div>
<div class="row" style="border-top: 1px solid #E0E4D6"><span style="color: #43483E">运费</span><span>包邮</span></div>
<div class="row" style="border-top: 1px solid #E0E4D6"><span style="color: #43483E">当前积分</span><span>1,280</span></div>
<div class="row" style="border-top: 1px solid #E0E4D6; font-weight: 500"><span>兑换后剩余</span><span style="color: #456732">680</span></div>
</div>

<div role="note" style="background: #FFE08B; color: #241A00; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; font-size: 13px; line-height: 19px">
<span class="ms" aria-hidden="true" style="font-size: 18px">info</span>
<span>积分兑换的商品不支持无理由退换。请确认收货地址无误，发货后无法修改。</span>
</div>
</main>

<div style="flex-shrink: 0; padding: 12px 16px 24px; background: #F8FAF0; border-top: 1px solid #E0E4D6">
<button class="cta" style="background: #456732; color: #FFFFFF; cursor: pointer" onClick="{{submit}}">确认兑换 · 600 积分</button>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 32px; text-align: center">
<span style="width: 96px; height: 96px; border-radius: 48px; background: #C5EFAB; color: #2E4F1C; display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true" style="font-size: 56px">redeem</span></span>
<div>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 500">兑换成功</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; color: #43483E">已扣除 600 积分，剩余 680<br>禾伴官方将在 3 个工作日内发货</p>
</div>
<div style="font-size: 12px; line-height: 16px; color: #43483E">订单号 DH202610100917</div>
</div>
<div style="padding: 0 24px 40px; display: flex; flex-direction: column; gap: 12px">
<a href="Orders.dc.html" class="cta" style="background: #456732; color: #FFFFFF">查看兑换记录</a>
<a href="PointsMall.dc.html" class="cta" style="border: 1px solid #74796D; color: #456732">继续逛</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const done = !!(this.state && this.state.done);
    return { editing: !done, done, submit: () => this.setState({ done: true }) };
  }
}
</script>
</body>
</html>
