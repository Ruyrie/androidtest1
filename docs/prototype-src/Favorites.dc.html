<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的收藏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:Roboto,'Noto Sans SC',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ib{width:48px;height:48px;flex-shrink:0;border:0;padding:0;background:transparent;border-radius:24px;color:#43483E;display:flex;align-items:center;justify-content:center}
.chip{height:32px;box-sizing:border-box;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;cursor:pointer}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px}
.th{width:64px;height:64px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center}
.tp{height:20px;padding:0 6px;border-radius:6px;font-size:11px;line-height:20px;font-weight:500}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<a href="Profile.dc.html" class="ib" aria-label="返回" style="color: #191D16"><span class="ms" aria-hidden="true">arrow_back</span></a>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">我的收藏</h1>
<button class="ib" aria-label="搜索收藏"><span class="ms" aria-hidden="true">search</span></button>
</header>

<div style="display: flex; gap: 8px; padding: 0 16px 8px; overflow: hidden; flex-shrink: 0">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<span role="button" aria-pressed="{{c.on}}" class="chip" style="background: {{c.bg}}; color: {{c.fg}}; border: {{c.bd}}; padding: {{c.pad}}" onClick="{{c.pick}}"><sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span></sc-if>{{c.name}}</span>
</sc-for>
</div>

<main style="flex: 1; min-height: 0; overflow: hidden">
<sc-for list="{{items}}" as="i" hint-placeholder-count="5">
<a href="{{i.href}}" class="row">
<span class="th" style="background: {{i.thBg}}; color: {{i.thFg}}"><span class="ms" aria-hidden="true">{{i.icon}}</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; line-height: 22px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{i.title}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #43483E"><span class="tp" style="background: {{i.tBg}}; color: {{i.tFg}}">{{i.type}}</span>{{i.meta}}</span>
</span>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 64px 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 36px; background: #E1E4D9; color: #74796D; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 36px">bookmark</span></span>
<span style="font-size: 16px; line-height: 24px; font-weight: 500">还没有收藏</span>
<span style="font-size: 14px; line-height: 20px; color: #43483E">看到有用的内容，点 <span class="ms" aria-hidden="true" style="font-size: 16px; vertical-align: -3px">bookmark</span> 收藏就能在这里找到</span>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = (this.state && this.state.c) || '全部';
    const T = {
      '动态': { tBg: '#D9E7CB', tFg: '#3E4A35' }, '问答': { tBg: '#FFE08B', tFg: '#241A00' },
      '百科': { tBg: '#BBEBEC', tFg: '#1E4E4E' }, '商品': { tBg: '#FFDAD6', tFg: '#93000A' }, '课程': {}
    };
    const all = [
      { type: '动态', title: '霜降前后大棚管理三件事：夜间保温、中午通风、少浇水', meta: '王农艺师 · 356 赞', icon: 'image', thBg: '#E1E4D9', thFg: '#74796D', href: 'PostDetail.dc.html' },
      { type: '百科', title: '黄瓜霜霉病：症状识别与防治方法', meta: '卵菌病害 · 可离线查看', icon: 'menu_book', thBg: '#BBEBEC', thFg: '#1E4E4E', href: 'PestDetail.dc.html' },
      { type: '商品', title: '句容红颜草莓 当天现摘', meta: '¥25 /斤 · 草莓姐姐', icon: 'image', thBg: '#E1E4D9', thFg: '#74796D', href: 'Product.dc.html' },
      { type: '问答', title: '黄瓜花多果少，怎么提高坐果率？', meta: '已解决 · 12 个回答', icon: 'question_answer', thBg: '#FFE08B', thFg: '#241A00', href: 'Question.dc.html' },
      { type: '动态', title: '今年的红颜定植完成啦！分享下定植密度和铺膜经验', meta: '草莓姐姐 · 128 赞', icon: 'image', thBg: '#E1E4D9', thFg: '#74796D', href: 'PostDetail.dc.html' }
    ];
    const items = all.filter((i) => cur === '全部' || i.type === cur).map((i) => Object.assign({}, i, T[i.type]));
    const names = ['全部', '动态', '问答', '百科', '商品'];
    return {
      items, empty: items.length === 0,
      cats: names.map((n) => {
        const on = n === cur;
        return { name: n, on, bg: on ? '#D9E7CB' : 'transparent', fg: on ? '#3E4A35' : '#43483E', bd: on ? '1px solid #D9E7CB' : '1px solid #C3C8BB', pad: on ? '0 12px 0 8px' : '0 12px', pick: () => this.setState({ c: n }) };
      })
    };
  }
}
</script>
</body>
</html>
