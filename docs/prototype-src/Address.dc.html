<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>收货地址</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input,textarea{font-family:Roboto,'Noto Sans SC',sans-serif}
input::placeholder,textarea::placeholder{color:#74796D}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ib{width:48px;height:48px;flex-shrink:0;border:0;padding:0;background:transparent;border-radius:24px;color:#191D16;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ad{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 12px 14px 16px;cursor:pointer;box-sizing:border-box}
.fld{position:relative;display:block}
.fl{position:absolute;left:12px;top:-8px;padding:0 4px;background:#F8FAF0;font-size:12px;line-height:16px;color:#43483E}
.fb{height:56px;box-sizing:border-box;border:1px solid #74796D;border-radius:4px;display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px;padding:0 12px 0 16px}
.fb input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;line-height:24px;color:#191D16;padding:0}
.cta{height:56px;width:100%;box-sizing:border-box;border:0;border-radius:28px;font-size:16px;line-height:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<sc-if value="{{listMode}}" hint-placeholder-val="{{ true }}">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<a href="MallConfirm.dc.html" class="ib" aria-label="返回"><span class="ms" aria-hidden="true">arrow_back</span></a>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">收货地址</h1>
</header>
<main role="radiogroup" aria-label="选择收货地址" style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{list}}" as="a" hint-placeholder-count="2">
<div role="radio" aria-checked="{{a.on}}" class="ad" style="background: {{a.bg}}; border: {{a.bd}}" onClick="{{a.pick}}">
<span class="ms {{a.cls}}" aria-hidden="true" style="color: {{a.ic}}; margin-top: 2px">{{a.icon}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 500">{{a.name}} <span style="font-weight: 400; color: #43483E; font-size: 14px">{{a.phone}}</span><sc-if value="{{a.isDefault}}" hint-placeholder-val="{{ false }}"><span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #D9E7CB; color: #3E4A35; font-size: 11px; line-height: 20px; font-weight: 500">默认</span></sc-if></span>
<span style="font-size: 14px; line-height: 20px; color: #43483E">{{a.addr}}</span>
</span>
<span class="ms" aria-label="编辑地址" style="color: #43483E; font-size: 20px; padding: 4px">edit</span>
</div>
</sc-for>
<span style="font-size: 12px; line-height: 16px; color: #43483E; padding: 0 4px">最多保存 10 个地址，点选即为本次兑换的收货地址</span>
</main>
<div style="flex-shrink: 0; padding: 12px 16px 24px">
<button class="cta" style="background: #456732; color: #FFFFFF; cursor: pointer; gap: 8px" onClick="{{openForm}}"><span class="ms" aria-hidden="true">add</span>新增收货地址</button>
</div>
</sc-if>

<sc-if value="{{formMode}}" hint-placeholder-val="{{ false }}">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<button class="ib" aria-label="关闭" onClick="{{closeForm}}"><span class="ms" aria-hidden="true">close</span></button>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">新增收货地址</h1>
</header>
<form style="flex: 1; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 20px">
<label class="fld"><span class="fl">收货人</span><span class="fb"><input value="{{fName}}" onChange="{{onName}}" placeholder="姓名" aria-label="收货人"></span></label>
<label class="fld"><span class="fl">手机号</span><span class="fb"><span style="color: #43483E">+86</span><span style="width: 1px; height: 24px; background: #C3C8BB"></span><input type="tel" inputmode="numeric" maxlength="11" value="{{fPhone}}" onChange="{{onPhone}}" placeholder="11 位手机号" aria-label="手机号"></span></label>
<label class="fld"><span class="fl">所在地区</span><span class="fb"><span style="flex: 1">江苏省 南京市 江宁区</span><span class="ms" aria-hidden="true" style="color: #43483E">arrow_drop_down</span></span></label>
<label class="fld"><span class="fl">详细地址</span><span class="fb"><input value="{{fAddr}}" onChange="{{onAddr}}" placeholder="街道、村、门牌号" aria-label="详细地址"><span class="ms" aria-hidden="true" style="color: #456732">my_location</span></span></label>
<div style="display: flex; align-items: center; gap: 16px; min-height: 56px; background: #EDEFE4; border-radius: 28px; padding: 8px 16px 8px 20px">
<span style="flex: 1; font-size: 16px; line-height: 24px">设为默认地址</span>
<button type="button" role="switch" aria-checked="{{fDef}}" aria-label="设为默认地址" onClick="{{toggleDef}}" style="width: 52px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; cursor: pointer; padding: {{swPad}}; background: {{swBg}}; border: {{swBd}}; justify-content: {{swJust}}"><span style="border-radius: 12px; display: flex; align-items: center; justify-content: center; width: {{th}}; height: {{th}}; background: {{thBg}}; color: #456732"><sc-if value="{{fDef}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 16px">check</span></sc-if></span></button>
</div>
<sc-if value="{{canSave}}" hint-placeholder-val="{{ false }}"><button type="button" class="cta" style="background: #456732; color: #FFFFFF; cursor: pointer" onClick="{{save}}">保存</button></sc-if>
<sc-if value="{{cannotSave}}" hint-placeholder-val="{{ true }}"><span class="cta" aria-disabled="true" style="background: rgba(25, 29, 22, 0.12); color: rgba(25, 29, 22, 0.38)">保存</span></sc-if>
</form>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const list = st.list || [
      { id: 1, name: '老李', phone: '13800005678', addr: '江苏省 南京市 江宁区 禾丰村 18 号（李家菜园）', isDefault: true },
      { id: 2, name: '李明', phone: '13900002468', addr: '江苏省 南京市 江宁区 东山街道 竹山路 66 号', isDefault: false }
    ];
    const sel = st.sel || 1;
    const form = !!st.form;
    const fName = st.fName || '', fPhone = st.fPhone || '', fAddr = st.fAddr || '';
    const fDef = !!st.fDef;
    const mask = (p) => p.slice(0, 3) + '****' + p.slice(7);
    const canSave = fName.trim() && /^1\d{10}$/.test(fPhone) && fAddr.trim().length >= 4;
    return {
      listMode: !form, formMode: form,
      list: list.map((a) => {
        const on = a.id === sel;
        return {
          name: a.name, phone: mask(a.phone), addr: a.addr, isDefault: a.isDefault, on,
          icon: on ? 'radio_button_checked' : 'radio_button_unchecked', cls: on ? 'f' : '', ic: on ? '#456732' : '#74796D',
          bg: on ? '#F2F5EA' : 'transparent', bd: on ? '2px solid #456732' : '1px solid #C3C8BB',
          pick: () => this.setState({ sel: a.id })
        };
      }),
      openForm: () => this.setState({ form: true, fName: '', fPhone: '', fAddr: '', fDef: false }),
      closeForm: () => this.setState({ form: false }),
      fName, fPhone, fAddr, fDef,
      onName: (e) => this.setState({ fName: e.target.value }),
      onPhone: (e) => this.setState({ fPhone: e.target.value.replace(/\D/g, '').slice(0, 11) }),
      onAddr: (e) => this.setState({ fAddr: e.target.value }),
      toggleDef: () => this.setState({ fDef: !fDef }),
      swBg: fDef ? '#456732' : '#E1E4D9', swBd: fDef ? '0' : '2px solid #74796D', swJust: fDef ? 'flex-end' : 'flex-start', swPad: fDef ? '0 4px' : '0 6px',
      th: fDef ? '24px' : '16px', thBg: fDef ? '#FFFFFF' : '#74796D',
      canSave: !!canSave, cannotSave: !canSave,
      save: () => {
        const id = Date.now();
        const base = fDef ? list.map((a) => Object.assign({}, a, { isDefault: false })) : list;
        const next = base.concat([{ id, name: fName.trim(), phone: fPhone, addr: '江苏省 南京市 江宁区 ' + fAddr.trim(), isDefault: fDef }]);
        this.setState({ list: next, sel: id, form: false });
      }
    };
  }
}
</script>
</body>
</html>
