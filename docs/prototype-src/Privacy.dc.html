<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>隐私设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:Roboto,'Noto Sans SC',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.it{min-height:64px;box-sizing:border-box;background:#EDEFE4;padding:8px 16px;display:flex;align-items:center;gap:16px;border:0;width:100%;text-align:left;color:#191D16;font-family:Roboto,'Noto Sans SC',sans-serif}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.t1{font-size:16px;line-height:24px}
.t2{font-size:14px;line-height:20px;color:#43483E}
.gl{margin:0;padding:16px 16px 8px;font-size:14px;line-height:20px;font-weight:500;color:#456732}
.grp{display:flex;flex-direction:column;gap:2px}
.sw{width:52px;height:32px;flex-shrink:0;box-sizing:border-box;border-radius:16px;display:flex;align-items:center;cursor:pointer;padding:0}
.opt{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;border:0;background:transparent;width:100%;text-align:left;font-size:16px;color:#191D16;cursor:pointer}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<a href="Settings.dc.html" aria-label="返回" style="width: 48px; height: 48px; border-radius: 24px; color: #191D16; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">arrow_back</span></a>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">隐私设置</h1>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px">
<h2 class="gl">谁能看到我</h2>
<div class="grp">
<button class="it" style="border-radius: 28px 28px 4px 4px; cursor: pointer" onClick="{{openPosts}}"><span class="tx"><span class="t1">谁可以看我的动态</span><span class="t2">{{posts}}</span></span><span class="ms" aria-hidden="true" style="color: #43483E">chevron_right</span></button>
<div class="it" style="border-radius: 4px"><span class="tx"><span class="t1">所在地区显示精度</span><span class="t2">仅显示到区县（江宁）</span></span><span class="ms" aria-hidden="true" style="color: #43483E">chevron_right</span></div>
<div class="it" style="border-radius: 4px 4px 28px 28px"><span class="tx"><span class="t1">允许通过手机号找到我</span><span class="t2">关闭后，农友只能通过昵称搜索</span></span>
<button type="button" role="switch" aria-checked="{{phone}}" aria-label="允许通过手机号找到我" class="sw" style="background: {{p.bg}}; border: {{p.bd}}; justify-content: {{p.just}}; padding: {{p.pad}}" onClick="{{togglePhone}}"><span style="border-radius: 12px; display: flex; align-items: center; justify-content: center; width: {{p.th}}; height: {{p.th}}; background: {{p.thBg}}; color: #456732"><sc-if value="{{phone}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 16px">check</span></sc-if></span></button></div>
</div>

<h2 class="gl">互动权限</h2>
<div class="grp">
<button class="it" style="border-radius: 28px 28px 4px 4px; cursor: pointer" onClick="{{openDm}}"><span class="tx"><span class="t1">谁可以私信我</span><span class="t2">{{dm}}</span></span><span class="ms" aria-hidden="true" style="color: #43483E">chevron_right</span></button>
<div class="it" style="border-radius: 4px"><span class="tx"><span class="t1">谁可以评论我的动态</span><span class="t2">所有人</span></span><span class="ms" aria-hidden="true" style="color: #43483E">chevron_right</span></div>
<div class="it" style="border-radius: 4px 4px 28px 28px"><span class="tx"><span class="t1">黑名单</span><span class="t2">2 人 · 对方无法查看主页和私信你</span></span><span class="ms" aria-hidden="true" style="color: #43483E">chevron_right</span></div>
</div>

<h2 class="gl">数据与权限</h2>
<div class="grp">
<div class="it" style="border-radius: 28px 28px 4px 4px"><span class="tx"><span class="t1">系统权限</span><span class="t2">相机、位置、通知、相册</span></span><span class="ms" aria-hidden="true" style="color: #43483E">open_in_new</span></div>
<div class="it" style="border-radius: 4px"><span class="tx"><span class="t1">导出我的数据</span><span class="t2">作物、农事、记账，导出为 Excel</span></span><span class="ms" aria-hidden="true" style="color: #43483E">chevron_right</span></div>
<a href="About.dc.html" class="it" style="border-radius: 4px 4px 28px 28px"><span class="tx"><span class="t1">隐私政策</span><span class="t2">2026年9月更新</span></span><span class="ms" aria-hidden="true" style="color: #43483E">chevron_right</span></a>
</div>
</main>

<sc-if value="{{dialog}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32); display: flex; align-items: center; justify-content: center; padding: 0 32px">
<div role="dialog" aria-modal="true" aria-labelledby="pv-title" style="width: 100%; background: #E7E9DF; border-radius: 28px; padding: 24px 0 16px; display: flex; flex-direction: column">
<h2 id="pv-title" style="margin: 0 24px 16px; font-size: 24px; line-height: 32px; font-weight: 500">{{dlgTitle}}</h2>
<div role="radiogroup" aria-labelledby="pv-title">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{o.on}}" class="opt" onClick="{{o.pick}}"><span class="ms {{o.cls}}" aria-hidden="true" style="color: {{o.c}}">{{o.icon}}</span>{{o.name}}</button>
</sc-for>
</div>
<div style="display: flex; justify-content: flex-end; padding: 8px 24px 0"><button onClick="{{close}}" style="height: 40px; border: 0; background: transparent; border-radius: 20px; padding: 0 12px; color: #456732; font-size: 14px; font-weight: 500; cursor: pointer">完成</button></div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const posts = st.posts || '所有人';
    const dm = st.dm || '我关注的人';
    const phone = !!st.phone;
    const which = st.dlg || '';
    const lists = { posts: ['所有人', '我关注的人', '仅自己'], dm: ['所有人', '我关注的人', '互相关注的人', '关闭私信'] };
    const cur = which === 'posts' ? posts : dm;
    const swStyle = (on) => ({ bg: on ? '#456732' : '#E1E4D9', bd: on ? '0' : '2px solid #74796D', just: on ? 'flex-end' : 'flex-start', pad: on ? '0 4px' : '0 6px', th: on ? '24px' : '16px', thBg: on ? '#FFFFFF' : '#74796D' });
    return {
      posts, dm, phone, p: swStyle(phone),
      togglePhone: () => this.setState({ phone: !phone }),
      dialog: !!which,
      dlgTitle: which === 'posts' ? '谁可以看我的动态' : '谁可以私信我',
      openPosts: () => this.setState({ dlg: 'posts' }),
      openDm: () => this.setState({ dlg: 'dm' }),
      close: () => this.setState({ dlg: '' }),
      opts: (lists[which] || []).map((name) => {
        const on = name === cur;
        return { name, on, icon: on ? 'radio_button_checked' : 'radio_button_unchecked', cls: on ? 'f' : '', c: on ? '#456732' : '#43483E', pick: () => this.setState(which === 'posts' ? { posts: name } : { dm: name }) };
      })
    };
  }
}
</script>
</body>
</html>
