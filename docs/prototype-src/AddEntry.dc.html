<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>记一笔</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:Roboto,'Noto Sans SC',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.seg{width:88px;height:40px;border:1px solid #74796D;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;box-sizing:border-box}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:500;cursor:pointer}
.cat .c{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.k{height:56px;border:0;border-radius:16px;background:#F8FAF0;color:#191D16;font-size:22px;line-height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.meta{height:32px;box-sizing:border-box;border:1px solid #C3C8BB;border-radius:8px;padding:0 8px 0 10px;display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:20px;font-weight:500;color:#191D16;white-space:nowrap}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<a href="Ledger.dc.html" aria-label="关闭" style="width: 48px; height: 48px; border-radius: 24px; color: #191D16; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></a>
<div role="radiogroup" aria-label="收支类型" style="flex: 1; display: flex; justify-content: center">
<span role="radio" aria-checked="{{isOut}}" class="seg" style="border-radius: 20px 0 0 20px; background: {{outBg}}; color: {{outFg}}" onClick="{{pickOut}}">支出</span>
<span role="radio" aria-checked="{{isIn}}" class="seg" style="border-left: 0; border-radius: 0 20px 20px 0; background: {{inBg}}; color: {{inFg}}" onClick="{{pickIn}}">收入</span>
</div>
<span style="width: 48px"></span>
</header>

<div style="padding: 16px 24px 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-size: 14px; line-height: 20px; color: #43483E">{{catName}}</span>
<span aria-live="polite" style="font-size: 45px; line-height: 52px; color: {{amtColor}}">{{sign}}¥{{amt}}</span>
</div>

<div role="radiogroup" aria-label="分类" style="padding: 8px 16px 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<span role="radio" aria-checked="{{c.on}}" class="cat" onClick="{{c.pick}}"><span class="c" style="background: {{c.bg}}; color: {{c.fg}}"><span class="ms" aria-hidden="true">{{c.icon}}</span></span><span style="color: {{c.lc}}">{{c.name}}</span></span>
</sc-for>
</div>

<div style="flex: 1"></div>

<div style="padding: 0 16px 12px; display: flex; gap: 8px; flex-wrap: wrap">
<span class="meta"><span class="ms" aria-hidden="true" style="font-size: 18px; color: #456732">nutrition</span>番茄 · 1号大棚<span class="ms" aria-hidden="true" style="font-size: 18px; color: #43483E">arrow_drop_down</span></span>
<span class="meta"><span class="ms" aria-hidden="true" style="font-size: 18px; color: #456732">event</span>今天 10/10</span>
<span class="meta" style="color: #43483E"><span class="ms" aria-hidden="true" style="font-size: 18px; color: #456732">edit_note</span>添加备注</span>
</div>

<div style="background: #EDEFE4; padding: 12px 12px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button class="k" onClick="{{k1}}">1</button><button class="k" onClick="{{k2}}">2</button><button class="k" onClick="{{k3}}">3</button><button class="k" aria-label="删除" onClick="{{back}}"><span class="ms" aria-hidden="true">backspace</span></button>
<button class="k" onClick="{{k4}}">4</button><button class="k" onClick="{{k5}}">5</button><button class="k" onClick="{{k6}}">6</button><button class="k" aria-label="清空" onClick="{{clear}}" style="font-size: 16px">清空</button>
<button class="k" onClick="{{k7}}">7</button><button class="k" onClick="{{k8}}">8</button><button class="k" onClick="{{k9}}">9</button>
<a href="Ledger.dc.html" class="k" style="grid-row: span 2; height: auto; background: #456732; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 500">保存</a>
<button class="k" onClick="{{kDot}}">.</button><button class="k" onClick="{{k0}}">0</button><button class="k" onClick="{{k00}}">00</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const kind = st.kind || 'out';
    const amt = st.amt !== undefined ? st.amt : '60';
    const outCats = [['化肥', 'compost'], ['农药', 'sanitizer'], ['种子种苗', 'psychiatry'], ['人工', 'groups'], ['水电灌溉', 'water_drop'], ['农机', 'agriculture'], ['地租', 'landscape'], ['其他', 'more_horiz']];
    const inCats = [['农产品销售', 'sell'], ['政府补贴', 'account_balance'], ['代耕作业', 'agriculture'], ['其他', 'more_horiz']];
    const list = kind === 'out' ? outCats : inCats;
    const cat = st.cat && list.some((c) => c[0] === st.cat) ? st.cat : list[0][0];
    const press = (s) => () => {
      let a = amt === '0' ? '' : amt;
      if (s === '.' && (a.includes('.') || a === '')) { if (a === '') a = '0'; else return; }
      const dot = a.indexOf('.');
      if (dot >= 0 && s !== '.' && a.length - dot > 2) return;
      if (a.replace('.', '').length >= 8) return;
      this.setState({ amt: a + s });
    };
    const out = kind === 'out';
    return {
      amt: amt === '' ? '0' : amt, sign: out ? '−' : '+', amtColor: out ? '#191D16' : '#456732',
      catName: (out ? '支出 · ' : '收入 · ') + cat,
      isOut: out, isIn: !out,
      outBg: out ? '#D9E7CB' : 'transparent', outFg: out ? '#3E4A35' : '#191D16',
      inBg: !out ? '#D9E7CB' : 'transparent', inFg: !out ? '#3E4A35' : '#191D16',
      pickOut: () => this.setState({ kind: 'out' }),
      pickIn: () => this.setState({ kind: 'in' }),
      cats: list.map(([name, icon]) => {
        const on = name === cat;
        return { name, icon, on, bg: on ? '#456732' : '#E1E4D9', fg: on ? '#FFFFFF' : '#43483E', lc: on ? '#191D16' : '#43483E', pick: () => this.setState({ cat: name }) };
      }),
      k1: press('1'), k2: press('2'), k3: press('3'), k4: press('4'), k5: press('5'), k6: press('6'),
      k7: press('7'), k8: press('8'), k9: press('9'), k0: press('0'), k00: press('00'), kDot: press('.'),
      back: () => this.setState({ amt: amt.length > 1 ? amt.slice(0, -1) : '0' }),
      clear: () => this.setState({ amt: '0' })
    };
  }
}
</script>
</body>
</html>
