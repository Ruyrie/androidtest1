<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>注册账号</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font-family:Roboto,'Noto Sans SC',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ib{width:48px;height:48px;flex-shrink:0;border:0;padding:0;background:transparent;border-radius:24px;color:#43483E;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fld{position:relative;display:block}
.fl{position:absolute;left:12px;top:-8px;padding:0 4px;background:#F8FAF0;font-size:12px;line-height:16px;color:#43483E}
.fb{height:56px;box-sizing:border-box;border:1px solid #74796D;border-radius:4px;padding:0 4px 0 16px;display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px}
.fb input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;line-height:24px;color:#191D16;padding:0}
.cta{height:56px;width:100%;box-sizing:border-box;border:0;border-radius:28px;background:#456732;color:#FFFFFF;font-size:16px;line-height:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
.rule{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<a href="Login.dc.html" class="ib" aria-label="返回" style="color: #191D16"><span class="ms" aria-hidden="true">arrow_back</span></a>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">注册账号</h1>
</header>
<div role="progressbar" aria-valuenow="1" aria-valuemin="0" aria-valuemax="2" aria-label="注册进度" style="height: 4px; background: #D9E7CB; flex-shrink: 0"><div style="width: 50%; height: 4px; background: #456732; border-radius: 0 2px 2px 0"></div></div>

<form style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 20px">
<div>
<div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #456732">第 1 步，共 2 步</div>
<div style="font-size: 16px; line-height: 24px; color: #43483E; margin-top: 4px">验证手机号并设置登录密码</div>
</div>

<label class="fld"><span class="fl">手机号</span><span class="fb"><span style="color: #43483E">+86</span><span style="width: 1px; height: 24px; background: #C3C8BB"></span><input type="tel" value="138 0000 5678" aria-label="手机号"></span></label>

<label class="fld"><span class="fl">验证码</span><span class="fb"><input inputmode="numeric" value="482915" aria-label="验证码"><span style="width: 1px; height: 24px; background: #C3C8BB"></span><span style="height: 40px; padding: 0 12px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #74796D">42s 后重发</span></span></label>

<div style="display: flex; flex-direction: column; gap: 8px">
<label class="fld"><span class="fl">设置密码</span><span class="fb"><input type="{{pwType}}" value="{{pw}}" onChange="{{onPw}}" aria-label="设置密码"><button type="button" class="ib" aria-label="{{eyeLabel}}" onClick="{{toggleEye}}"><span class="ms" aria-hidden="true">{{eyeIcon}}</span></button></span></label>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<span style="height: 4px; border-radius: 2px; background: {{s1}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{s2}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{s3}}"></span>
</div>
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: {{levelColor}}">强度：{{level}}</span>
</div>
<div style="display: flex; gap: 16px; padding: 0 4px; flex-wrap: wrap">
<span class="rule" style="color: {{r1c}}"><span class="ms f" aria-hidden="true" style="font-size: 16px">{{r1i}}</span>8–20 位</span>
<span class="rule" style="color: {{r2c}}"><span class="ms f" aria-hidden="true" style="font-size: 16px">{{r2i}}</span>包含字母</span>
<span class="rule" style="color: {{r3c}}"><span class="ms f" aria-hidden="true" style="font-size: 16px">{{r3i}}</span>包含数字</span>
</div>
</div>

<label class="fld"><span class="fl">确认密码</span><span class="fb" style="padding-right: 12px"><input type="password" value="heban2026" aria-label="确认密码"><span class="ms f" aria-hidden="true" style="color: #456732">check_circle</span></span></label>

<label style="display: flex; align-items: flex-start; gap: 12px; font-size: 14px; line-height: 20px; color: #43483E">
<input type="checkbox" checked style="accent-color: #456732; width: 18px; height: 18px; margin: 1px 0 0; flex-shrink: 0">
<span>我已阅读并同意 <a href="About.dc.html" style="color: #456732; font-weight: 500">《用户协议》</a> 和 <a href="About.dc.html" style="color: #456732; font-weight: 500">《隐私政策》</a></span>
</label>

<a href="ProfileSetup.dc.html" class="cta">下一步</a>
<a href="Login.dc.html" style="align-self: center; height: 40px; display: flex; align-items: center; font-size: 14px; color: #43483E">已有账号？<span style="color: #456732; font-weight: 500">去登录</span></a>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const pw = st.pw !== undefined ? st.pw : 'heban2026';
    const show = !!st.show;
    const okLen = pw.length >= 8 && pw.length <= 20;
    const hasL = /[a-zA-Z]/.test(pw);
    const hasD = /\d/.test(pw);
    const hasS = /[^a-zA-Z0-9]/.test(pw);
    let lv = 0;
    if (pw.length > 0) lv = 1;
    if (okLen && hasL && hasD) lv = 2;
    if (okLen && hasL && hasD && (hasS || pw.length >= 12)) lv = 3;
    const colors = ['#E1E4D9', '#BA1A1A', '#745B00', '#456732'];
    const names = ['未输入', '弱', '中', '强'];
    const c = colors[lv];
    const rule = (ok) => ({ c: ok ? '#456732' : '#74796D', i: ok ? 'check_circle' : 'radio_button_unchecked' });
    const a = rule(okLen), b = rule(hasL), d = rule(hasD);
    return {
      pw, pwType: show ? 'text' : 'password',
      eyeIcon: show ? 'visibility_off' : 'visibility', eyeLabel: show ? '隐藏密码' : '显示密码',
      toggleEye: () => this.setState({ show: !show }),
      onPw: (e) => this.setState({ pw: e.target.value }),
      s1: lv >= 1 ? c : '#E1E4D9', s2: lv >= 2 ? c : '#E1E4D9', s3: lv >= 3 ? c : '#E1E4D9',
      level: names[lv], levelColor: lv === 0 ? '#43483E' : c,
      r1c: a.c, r1i: a.i, r2c: b.c, r2i: b.i, r3c: d.c, r3i: d.i
    };
  }
}
</script>
</body>
</html>
