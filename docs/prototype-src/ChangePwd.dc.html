<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>修改密码</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font-family:Roboto,'Noto Sans SC',sans-serif}
input::placeholder{color:#74796D}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ib{width:48px;height:48px;flex-shrink:0;border:0;padding:0;background:transparent;border-radius:24px;color:#43483E;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fld{position:relative;display:block}
.fl{position:absolute;left:12px;top:-8px;padding:0 4px;background:#F8FAF0;font-size:12px;line-height:16px}
.fb{height:56px;box-sizing:border-box;border-radius:4px;display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px}
.fb input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;line-height:24px;color:#191D16;padding:0}
.cta{height:56px;width:100%;box-sizing:border-box;border:0;border-radius:28px;font-size:16px;line-height:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
.rule{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px}
.stp{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;flex-shrink:0;box-sizing:border-box}
.code{height:40px;border:0;background:transparent;border-radius:20px;padding:0 12px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;display:flex;align-items:center}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px">
<sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}"><a href="Security.dc.html" class="ib" aria-label="返回" style="color: #191D16"><span class="ms" aria-hidden="true">arrow_back</span></a></sc-if>
<sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}"><button class="ib" aria-label="返回上一步" style="color: #191D16" onClick="{{back}}"><span class="ms" aria-hidden="true">arrow_back</span></button></sc-if>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">修改密码</h1>
</header>

<form style="padding: 16px 24px 0; display: flex; flex-direction: column; gap: 24px">
<ol aria-label="步骤" style="list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 8px">
<li style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: {{s1Text}}; font-weight: {{s1W}}"><span class="stp" style="background: {{s1Bg}}; color: {{s1Fg}}"><sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span></sc-if><sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">1</sc-if></span>验证身份</li>
<li aria-hidden="true" style="flex: 1; height: 1px; background: {{lineBg}}"></li>
<li style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: {{s2Text}}; font-weight: {{s2W}}"><span class="stp" style="background: {{s2Bg}}; color: {{s2Fg}}; border: {{s2Bd}}">2</span>设置新密码</li>
</ol>

<sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #43483E">为确认是你本人操作，我们会向账号绑定的手机号发送 6 位验证码，无需输入原密码。</p>
<label class="fld"><span class="fl" style="color: #43483E">已绑定手机号</span><span class="fb" style="border: 1px solid #C3C8BB; background: #F2F5EA; padding: 0 16px; color: #191D16"><span class="ms" aria-hidden="true" style="font-size: 20px; color: #456732">smartphone</span><span style="flex: 1; letter-spacing: 0.5px">+86 138****5678</span><span class="ms f" aria-label="已验证" style="font-size: 20px; color: #456732">verified</span></span></label>
<div style="display: flex; flex-direction: column; gap: 4px">
<label class="fld"><span class="fl" style="color: #43483E">验证码</span><span class="fb" style="border: 1px solid #74796D; padding: 0 4px 0 16px"><input inputmode="numeric" maxlength="6" placeholder="6 位数字" value="{{code}}" onChange="{{onCode}}" aria-label="验证码"><span style="width: 1px; height: 24px; background: #C3C8BB"></span>
<sc-if value="{{canSend}}" hint-placeholder-val="{{ true }}"><button type="button" class="code" style="color: #456732; cursor: pointer" onClick="{{send}}">{{sendText}}</button></sc-if>
<sc-if value="{{counting}}" hint-placeholder-val="{{ false }}"><span class="code" style="color: #74796D">{{left}}s 后重发</span></sc-if>
</span></label>
<span style="padding: 0 16px; font-size: 12px; line-height: 16px; color: #43483E">{{codeHint}}</span>
</div>
<sc-if value="{{codeOk}}" hint-placeholder-val="{{ false }}"><button type="button" class="cta" style="background: #456732; color: #FFFFFF; cursor: pointer" onClick="{{next}}">下一步</button></sc-if>
<sc-if value="{{codeNotOk}}" hint-placeholder-val="{{ true }}"><span class="cta" aria-disabled="true" style="background: rgba(25, 29, 22, 0.12); color: rgba(25, 29, 22, 0.38)">下一步</span></sc-if>
<div role="note" style="background: #BBEBEC; color: #1E4E4E; border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; font-size: 14px; line-height: 20px">
<span class="ms" aria-hidden="true" style="font-size: 20px">info</span>
<span>收不到验证码？请确认手机信号正常、短信未被拦截，60 秒后可重新获取。</span>
</div>
</sc-if>

<sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="fld"><span class="fl" style="color: #43483E">新密码</span><span class="fb" style="border: 1px solid #74796D; padding: 0 4px 0 16px"><input type="{{pwType}}" value="{{np}}" onChange="{{onNp}}" placeholder="8–20 位，含字母和数字" aria-label="新密码"><button type="button" class="ib" aria-label="{{eyeLabel}}" onClick="{{toggleEye}}"><span class="ms" aria-hidden="true">{{eyeIcon}}</span></button></span></label>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<span class="rule" style="color: {{r1c}}"><span class="ms f" aria-hidden="true" style="font-size: 18px">{{r1i}}</span>8–20 位</span>
<span class="rule" style="color: {{r2c}}"><span class="ms f" aria-hidden="true" style="font-size: 18px">{{r2i}}</span>同时包含字母和数字</span>
<span class="rule" style="color: #43483E"><span class="ms" aria-hidden="true" style="font-size: 18px">info</span>不能与最近使用过的 3 个密码相同</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label class="fld"><span class="fl" style="color: {{cfColor}}">确认新密码</span><span class="fb" style="padding: 0 12px 0 15px; border: {{cfBorder}}"><input type="password" value="{{cp}}" onChange="{{onCp}}" placeholder="再次输入新密码" aria-label="确认新密码" aria-invalid="{{mismatch}}"><sc-if value="{{mismatch}}" hint-placeholder-val="{{ false }}"><span class="ms f" aria-hidden="true" style="color: #BA1A1A">error</span></sc-if><sc-if value="{{matched}}" hint-placeholder-val="{{ false }}"><span class="ms f" aria-hidden="true" style="color: #456732">check_circle</span></sc-if></span></label>
<span role="alert" style="padding: 0 16px; font-size: 12px; line-height: 16px; color: {{cfColor}}">{{cfMsg}}</span>
</div>
<sc-if value="{{valid}}" hint-placeholder-val="{{ false }}"><button type="button" class="cta" style="background: #456732; color: #FFFFFF; cursor: pointer" onClick="{{submit}}">确认修改</button></sc-if>
<sc-if value="{{invalid}}" hint-placeholder-val="{{ true }}"><span class="cta" aria-disabled="true" style="background: rgba(25, 29, 22, 0.12); color: rgba(25, 29, 22, 0.38)">确认修改</span></sc-if>
</sc-if>
</form>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 32px; text-align: center">
<span style="width: 96px; height: 96px; border-radius: 48px; background: #C5EFAB; color: #2E4F1C; display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true" style="font-size: 56px">check_circle</span></span>
<div>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 500">密码已修改</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; color: #43483E">其他设备上的登录已失效，请使用新密码重新登录。本机作物数据不受影响。</p>
</div>
</div>
<div style="padding: 0 24px 40px"><a href="Login.dc.html" class="cta" style="background: #456732; color: #FFFFFF">重新登录</a></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const st = this.state || {};
    const step = st.step || 1;
    const left = st.left || 0;
    const sent = !!st.sent;
    const code = st.code || '';
    const np = st.np || '';
    const cp = st.cp || '';
    const show = !!st.show;
    const codeOk = /^\d{6}$/.test(code);
    const okLen = np.length >= 8 && np.length <= 20;
    const okMix = /[a-zA-Z]/.test(np) && /\d/.test(np);
    const rule = (ok) => ({ c: ok ? '#456732' : '#74796D', i: ok ? 'check_circle' : 'radio_button_unchecked' });
    const a = rule(okLen), b = rule(okMix);
    const mismatch = cp.length > 0 && cp !== np;
    const matched = cp.length > 0 && cp === np;
    const valid = okLen && okMix && matched;
    const s2 = step === 2;
    return {
      notDone: step < 3, done: step === 3, isStep1: step === 1, isStep2: s2,
      s1Bg: s2 ? '#C5EFAB' : '#456732', s1Fg: s2 ? '#2E4F1C' : '#FFFFFF', s1Text: s2 ? '#43483E' : '#191D16', s1W: s2 ? '400' : '500',
      s2Bg: s2 ? '#456732' : 'transparent', s2Fg: s2 ? '#FFFFFF' : '#43483E', s2Bd: s2 ? '0' : '1px solid #74796D', s2Text: s2 ? '#191D16' : '#43483E', s2W: s2 ? '500' : '400',
      lineBg: s2 ? '#456732' : '#C3C8BB',
      code, onCode: (e) => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6) }),
      left, counting: left > 0, canSend: left <= 0,
      sendText: sent ? '重新获取' : '获取验证码',
      codeHint: sent ? '验证码已发送至 138****5678，5 分钟内有效' : '点击「获取验证码」，短信将发送到上方手机号',
      send: () => {
        if (this.timer) clearInterval(this.timer);
        this.setState({ left: 60, sent: true });
        this.timer = setInterval(() => {
          const n = ((this.state && this.state.left) || 0) - 1;
          this.setState({ left: n > 0 ? n : 0 });
          if (n <= 0) clearInterval(this.timer);
        }, 1000);
      },
      codeOk, codeNotOk: !codeOk,
      next: () => this.setState({ step: 2 }),
      back: () => this.setState({ step: 1 }),
      np, cp,
      onNp: (e) => this.setState({ np: e.target.value }),
      onCp: (e) => this.setState({ cp: e.target.value }),
      pwType: show ? 'text' : 'password', eyeIcon: show ? 'visibility_off' : 'visibility', eyeLabel: show ? '隐藏密码' : '显示密码',
      toggleEye: () => this.setState({ show: !show }),
      r1c: a.c, r1i: a.i, r2c: b.c, r2i: b.i,
      mismatch, matched,
      cfColor: mismatch ? '#BA1A1A' : (matched ? '#456732' : '#43483E'),
      cfBorder: mismatch ? '2px solid #BA1A1A' : '1px solid #74796D',
      cfMsg: mismatch ? '两次输入的密码不一致' : (matched ? '两次输入一致' : '请再次输入新密码'),
      valid, invalid: !valid,
      submit: () => { if (this.timer) clearInterval(this.timer); this.setState({ step: 3 }); }
    };
  }
}
</script>
</body>
</html>
