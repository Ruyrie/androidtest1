<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>添加作物</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
textarea::placeholder{color:#43483E}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
<a href="Crops.dc.html" aria-label="关闭" style="width: 48px; height: 48px; border-radius: 24px; color: #191D16; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">close</span></a>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">添加作物</h1>
<a href="Crops.dc.html" style="height: 40px; padding: 0 12px; border-radius: 20px; display: flex; align-items: center; color: #456732; font-size: 14px; line-height: 20px; font-weight: 500">保存</a>
</header>

<form style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 20px">

<button type="button" style="height: 128px; flex-shrink: 0; border: 0; border-radius: 12px; background: #E7E9DF; color: #43483E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: Roboto, 'Noto Sans SC', sans-serif">
<span class="ms" aria-hidden="true" style="font-size: 32px; color: #456732">add_a_photo</span>
<span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #191D16">添加作物照片</span>
<span style="font-size: 12px; line-height: 16px">拍照或从相册选择</span>
</button>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="position: relative; display: block">
<span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #F8FAF0; font-size: 12px; line-height: 16px; color: #43483E">作物名称</span>
<input value="草莓" style="width: 100%; box-sizing: border-box; height: 56px; border: 1px solid #74796D; border-radius: 4px; padding: 0 16px; background: transparent; font: 400 16px/24px Roboto, 'Noto Sans SC', sans-serif; color: #191D16; outline: 0">
</label>
<label style="position: relative; display: block">
<span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #F8FAF0; font-size: 12px; line-height: 16px; color: #43483E">品种</span>
<input value="红颜" style="width: 100%; box-sizing: border-box; height: 56px; border: 1px solid #74796D; border-radius: 4px; padding: 0 16px; background: transparent; font: 400 16px/24px Roboto, 'Noto Sans SC', sans-serif; color: #191D16; outline: 0">
</label>
</div>

<label style="position: relative; display: block">
<span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #F8FAF0; font-size: 12px; line-height: 16px; color: #43483E">种植地块</span>
<span style="height: 56px; box-sizing: border-box; border: 1px solid #74796D; border-radius: 4px; padding: 0 12px 0 16px; display: flex; align-items: center; font-size: 16px; line-height: 24px"><span style="flex: 1">2号大棚</span><span class="ms" aria-hidden="true" style="color: #43483E">arrow_drop_down</span></span>
</label>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; line-height: 20px; font-weight: 500">种植方式</span>
<div role="group" aria-label="种植方式" style="display: flex; height: 40px">
<button type="button" aria-pressed="true" style="flex: 1; border: 1px solid #74796D; border-radius: 20px 0 0 20px; background: #D9E7CB; color: #3E4A35; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px/20px Roboto, 'Noto Sans SC', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span>大棚</button>
<button type="button" aria-pressed="false" style="flex: 1; border: 1px solid #74796D; border-left: 0; background: transparent; color: #191D16; font: 500 14px/20px Roboto, 'Noto Sans SC', sans-serif">露天</button>
<button type="button" aria-pressed="false" style="flex: 1; border: 1px solid #74796D; border-left: 0; border-radius: 0 20px 20px 0; background: transparent; color: #191D16; font: 500 14px/20px Roboto, 'Noto Sans SC', sans-serif">盆栽</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<label style="position: relative; display: block">
<span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #F8FAF0; font-size: 12px; line-height: 16px; color: #456732">种植面积（亩）</span>
<span style="height: 56px; box-sizing: border-box; border: 2px solid #456732; border-radius: 4px; padding: 0 15px; display: flex; align-items: center; font-size: 16px; line-height: 24px">0.3<span style="width: 2px; height: 22px; margin-left: 1px; background: #456732"></span></span>
</label>
<span style="padding: 0 16px; font-size: 12px; line-height: 16px; color: #43483E">用于估算用肥量与产量</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<label style="position: relative; display: block">
<span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #F8FAF0; font-size: 12px; line-height: 16px; color: #43483E">定植日期</span>
<span style="height: 56px; box-sizing: border-box; border: 1px solid #74796D; border-radius: 4px; padding: 0 12px 0 16px; display: flex; align-items: center; font-size: 16px; line-height: 24px"><span style="flex: 1">2026年10月10日</span><span class="ms" aria-hidden="true" style="color: #43483E">calendar_today</span></span>
</label>
<span style="padding: 0 16px; font-size: 12px; line-height: 16px; color: #43483E">预计采收：2027年3月上旬（按 150 天计）</span>
</div>

<label style="position: relative; display: block">
<span style="position: absolute; left: 12px; top: -8px; padding: 0 4px; background: #F8FAF0; font-size: 12px; line-height: 16px; color: #43483E">备注</span>
<textarea placeholder="如：使用防虫网、基肥用量等" style="display: block; width: 100%; box-sizing: border-box; height: 88px; resize: none; border: 1px solid #74796D; border-radius: 4px; padding: 16px; background: transparent; font: 400 16px/24px Roboto, 'Noto Sans SC', sans-serif; color: #191D16; outline: 0"></textarea>
</label>

<div style="display: flex; align-items: center; gap: 16px; min-height: 56px">
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 16px; line-height: 24px">开启农事提醒</span>
<span style="font-size: 14px; line-height: 20px; color: #43483E">按生长阶段提醒施肥、用药</span>
</span>
<button type="button" role="switch" aria-checked="true" aria-label="开启农事提醒" style="width: 52px; height: 32px; border: 0; padding: 0 4px; border-radius: 16px; background: #456732; display: flex; align-items: center; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; color: #456732; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 16px">check</span></span></button>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
