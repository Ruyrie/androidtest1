<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>完善资料</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font-family:Roboto,'Noto Sans SC',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.ib{width:48px;height:48px;flex-shrink:0;border:0;padding:0;background:transparent;border-radius:24px;color:#191D16;display:flex;align-items:center;justify-content:center}
.fld{position:relative;display:block}
.fl{position:absolute;left:12px;top:-8px;padding:0 4px;background:#F8FAF0;font-size:12px;line-height:16px;color:#43483E}
.fb{height:56px;box-sizing:border-box;border:1px solid #74796D;border-radius:4px;padding:0 12px 0 16px;display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px}
.fb input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;line-height:24px;color:#191D16;padding:0}
.cta{height:56px;width:100%;box-sizing:border-box;border:0;border-radius:28px;background:#456732;color:#FFFFFF;font-size:16px;line-height:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
.chip{height:32px;box-sizing:border-box;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:500;cursor:pointer}
.seg{flex:1;border:1px solid #74796D;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;line-height:20px;font-weight:500;cursor:pointer}
.h2{margin:0;font-size:14px;line-height:20px;font-weight:500}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #F8FAF0; color: #191D16; font-family: Roboto, 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
<a href="Register.dc.html" class="ib" aria-label="返回"><span class="ms" aria-hidden="true">arrow_back</span></a>
<h1 style="margin: 0 0 0 4px; flex: 1; font-size: 22px; line-height: 28px; font-weight: 500">完善资料</h1>
<a href="Main.dc.html" style="height: 40px; padding: 0 12px; border-radius: 20px; display: flex; align-items: center; color: #456732; font-size: 14px; font-weight: 500">跳过</a>
</header>
<div role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="2" aria-label="注册进度" style="height: 4px; background: #456732; flex-shrink: 0"></div>

<form style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 22px">
<div>
<div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #456732">第 2 步，共 2 步</div>
<div style="font-size: 16px; line-height: 24px; color: #43483E; margin-top: 4px">让农友认识你，也让 AI 推荐更准</div>
</div>

<button type="button" aria-label="上传头像" style="align-self: center; position: relative; width: 96px; height: 96px; border: 0; padding: 0; border-radius: 48px; background: #C5EFAB; color: #2E4F1C; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 500">李<span style="position: absolute; right: -2px; bottom: -2px; width: 36px; height: 36px; border-radius: 18px; border: 3px solid #F8FAF0; background: #456732; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 18px">photo_camera</span></span></button>

<label class="fld"><span class="fl">昵称</span><span class="fb"><input value="老李种菜" aria-label="昵称"><span style="font-size: 12px; color: #43483E">4/16</span></span></label>

<label class="fld"><span class="fl">所在地区</span><span class="fb"><span style="flex: 1">江苏省 南京市 江宁区</span><span class="ms" aria-hidden="true" style="color: #43483E">my_location</span></span></label>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 class="h2">种植身份</h2>
<div role="group" aria-label="种植身份" style="display: flex; height: 40px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
<span role="button" aria-pressed="{{r.on}}" class="seg" style="background: {{r.bg}}; color: {{r.fg}}; border-radius: {{r.rad}}; border-left-width: {{r.bl}}" onClick="{{r.pick}}"><sc-if value="{{r.on}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span></sc-if>{{r.name}}</span>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 class="h2">你主要种什么？<span style="font-weight: 400; color: #43483E">（已选 {{count}} 项，可多选）</span></h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{crops}}" as="c" hint-placeholder-count="10">
<span role="button" aria-pressed="{{c.on}}" class="chip" style="background: {{c.bg}}; color: {{c.fg}}; border: {{c.bd}}; padding: {{c.pad}}" onClick="{{c.toggle}}"><sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><span class="ms" aria-hidden="true" style="font-size: 18px">check</span></sc-if>{{c.name}}</span>
</sc-for>
</div>
</div>

<a href="Main.dc.html" class="cta" style="margin-top: 4px">进入禾伴</a>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || { '番茄': true, '黄瓜': true, '小麦': true };
    const role = st.role || '种植户';
    const names = ['番茄', '黄瓜', '草莓', '小麦', '水稻', '玉米', '果树', '茶叶', '食用菌', '中药材'];
    const roleNames = ['种植户', '家庭园艺', '农技人员'];
    const crops = names.map((n) => {
      const on = !!sel[n];
      return {
        name: n, on,
        bg: on ? '#D9E7CB' : 'transparent', fg: on ? '#3E4A35' : '#43483E',
        bd: on ? '1px solid #D9E7CB' : '1px solid #C3C8BB', pad: on ? '0 16px 0 8px' : '0 16px',
        toggle: () => { const next = Object.assign({}, sel); next[n] = !on; this.setState({ sel: next }); }
      };
    });
    const roles = roleNames.map((n, i) => {
      const on = n === role;
      const last = i === roleNames.length - 1;
      return {
        name: n, on,
        bg: on ? '#D9E7CB' : 'transparent', fg: on ? '#3E4A35' : '#191D16',
        rad: i === 0 ? '20px 0 0 20px' : (last ? '0 20px 20px 0' : '0'),
        bl: i === 0 ? '1px' : '0',
        pick: () => this.setState({ role: n })
      };
    });
    return { crops, roles, count: names.filter((n) => sel[n]).length };
  }
}
</script>
</body>
</html>
